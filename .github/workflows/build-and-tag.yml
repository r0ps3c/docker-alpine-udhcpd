name: Build and Tag

on:
  schedule:
    - cron: '0 4 * * 1'  # Weekly Monday 04:00 UTC
  push:
    branches:
      - main
      - stable
  pull_request:
    branches:
      - main
      - stable
  workflow_dispatch:

jobs:
  build-scan-push:
    uses: r0ps3c/gh-shared-workflows/.github/workflows/docker-build-scan-push.yml@9430b098f0d7aa6a31a5779a01e6f690fac1baed # main
    with:
      image-ref: alpine-udhcpd:main
      version-extract-command: "apk info busybox-extras 2>/dev/null | grep '^busybox-extras-[0-9]' | head -1 | sed 's/^busybox-extras-//' | sed 's/ .*//' | sed 's/-r[0-9]*$//'"
      test-command: make test-structure && make test-standalone && make test-integration
    secrets: inherit
